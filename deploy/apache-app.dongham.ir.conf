# Permanent merge of the PWA origin onto the apex host.
# Keep DNS + TLS for app.dongham.ir so old HTTPS links can 301.
# / → /app so bookmarks of the old app home do not land on the marketing page.
# Other paths keep their suffix (/i/..., /periods/..., /auth, /more).
#
# Do NOT use `Redirect / https://dongham.ir/app` — Apache would map /foo to /app/foo.

<VirtualHost *:80>
  ServerName app.dongham.ir
  RedirectMatch 301 ^/$ https://dongham.ir/app
  RedirectMatch 301 ^/(.+)$ https://dongham.ir/$1
</VirtualHost>

<VirtualHost *:443>
  ServerName app.dongham.ir
  RedirectMatch 301 ^/$ https://dongham.ir/app
  RedirectMatch 301 ^/(.+)$ https://dongham.ir/$1
  # SSLEngine and certificate paths are host-specific (DirectAdmin / Let's Encrypt).
</VirtualHost>
