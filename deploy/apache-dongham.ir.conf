# Apex vhost: marketing + PWA + /api on https://dongham.ir
# DocumentRoot MUST be the git repo root (public_html), not apps/marketing/dist.
# Routing lives in deploy/public_html.htaccess (copy to /home/dongham/public_html/.htaccess).
# Requires: mod_rewrite, mod_headers, mod_proxy, mod_proxy_http, AllowOverride All.
# DirectorySlash Off avoids leaking /apps/marketing/dist/ on directory URLs.

<VirtualHost *:80>
  ServerName dongham.ir
  ServerAlias www.dongham.ir
  Redirect permanent / https://dongham.ir/
</VirtualHost>

<VirtualHost *:443>
  ServerName dongham.ir
  ServerAlias www.dongham.ir
  DocumentRoot /home/dongham/public_html
  DirectorySlash Off

  <Directory /home/dongham/public_html>
    AllowOverride All
    Require all granted
    Options -Indexes +FollowSymLinks
    DirectoryIndex index.html
  </Directory>

  # SSLEngine and certificate paths are host-specific (DirectAdmin / Let's Encrypt).
</VirtualHost>
